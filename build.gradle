plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

version = '1.5.0-ea'

application {
    mainClass = 'tutorconnect.TutorConnectLauncher'
}

run {
    // Course requirement: run the app from source with Java assertions (-ea) enabled.
    enableAssertions = true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    useJUnitPlatform()
    // Course requirement: run tests with Java assertions (-ea) enabled.
    enableAssertions = true
    inputs.property('f01UiTests', System.getenv('F01_UI_TESTS') ?: 'false')
    inputs.property('f06UiTests', System.getenv('F06_UI_TESTS') ?: 'false')
    inputs.property('f08UiTests', System.getenv('F08_UI_TESTS') ?: 'false')
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    implementation "org.openjfx:javafx-base:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:linux"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

shadowJar {
    archiveFileName = 'tutorconnect.jar'
    manifest {
        attributes 'Implementation-Title': 'TutorConnect',
                'Implementation-Version': project.version
    }
}

// Keep the thin JAR distinct from the executable fat JAR when the project name matches.
tasks.named('jar') {
    archiveClassifier = 'plain'
}

tasks.register('verifyShadowJar') {
    group = 'verification'
    description = 'Checks the executable JAR manifest and essential application resources.'
    dependsOn tasks.named('shadowJar')
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    inputs.property('mainClass', application.mainClass)
    inputs.property('releaseVersion', project.version.toString())
    doLast {
        new java.util.jar.JarFile(inputs.files.singleFile).withCloseable { jar ->
            String launcher = inputs.properties.mainClass
            if (jar.manifest?.mainAttributes?.getValue('Main-Class') != launcher) {
                throw new GradleException('The executable JAR has an incorrect Main-Class manifest entry.')
            }
            if (jar.manifest.mainAttributes.getValue('Implementation-Version') != inputs.properties.releaseVersion) {
                throw new GradleException('The executable JAR has incorrect release version metadata.')
            }
            [launcher.replace('.', '/') + '.class', 'view/MainWindow.fxml',
             'view/StudentListPanel.fxml', 'view/TutorConnectTheme.css'].each { entry ->
                if (jar.getJarEntry(entry) == null) {
                    throw new GradleException("The executable JAR is missing ${entry}.")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyShadowJar')
}

defaultTasks 'build'
